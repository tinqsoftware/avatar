name: Deploy avatar to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: avatar-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build static assets
        run: |
          npm ci
          npm run build

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H -p "${VPS_PORT:-22}" "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Upload immutable release
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          RELEASE: ${{ github.sha }}
        run: |
          ssh -p "${VPS_PORT:-22}" deploy@"$VPS_HOST" "mkdir -p /var/www/avatar/releases/$RELEASE"
          tar \
            --exclude-vcs \
            --exclude=.env \
            --exclude=storage \
            --exclude=vendor \
            -czf - . | ssh -p "${VPS_PORT:-22}" deploy@"$VPS_HOST" "tar -xzf - -C /var/www/avatar/releases/$RELEASE"

      - name: Activate release
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          RELEASE: ${{ github.sha }}
        run: |
          ssh -p "${VPS_PORT:-22}" deploy@"$VPS_HOST" "RELEASE=/var/www/avatar/releases/$RELEASE bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$RELEASE"
          ln -sfn /var/www/avatar/shared/.env .env
          ln -sfn /var/www/avatar/shared/storage storage
          composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader
          php artisan migrate --force
          php artisan storage:link
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          ln -sfn "$RELEASE" /var/www/avatar/current
          sudo supervisorctl restart avatar-queue:*
          REMOTE
