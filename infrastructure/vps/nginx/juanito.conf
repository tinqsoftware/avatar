# /etc/nginx/sites-available/avatar
# Requiere que el certificado wildcard de *.ia.tinq.pe ya exista en el VPS.
server {
    listen 80;
    listen [::]:80;
    server_name ia.tinq.pe *.ia.tinq.pe;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ia.tinq.pe *.ia.tinq.pe;

    root /var/www/avatar/current/public;
    index index.php;

    ssl_certificate /etc/letsencrypt/live/ia.tinq.pe/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ia.tinq.pe/privkey.pem;

    client_max_body_size 22m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        # Ajustar solo si el VPS usa otra versión de PHP-FPM.
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
